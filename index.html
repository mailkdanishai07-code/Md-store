<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD STORE - Maira Beauty Collection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #fcf8f9; color: #222; text-align: right; }
        
        /* Top Brand Header */
        header { 
            background: linear-gradient(135deg, #ffffff 0%, #fff5f7 100%); 
            padding: 15px 20px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 3px solid #d4145a;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .brand-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
        .logo-img { height: 55px; width: auto; border-radius: 8px; object-fit: contain; margin-bottom: 2px; }
        .brand-title { font-size: 30px; font-weight: 900; color: #1b4332; letter-spacing: 2px; text-transform: uppercase; line-height: 1; }
        .brand-title span { color: #d4145a; }
        .brand-tagline { font-size: 13px; font-weight: 700; color: #d4145a; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

        /* Direct Top WhatsApp Button */
        .top-wa-btn {
            background: #25D366;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.35);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .top-wa-btn:hover { background: #1eb954; transform: scale(1.03); }

        /* Main Front Banner */
        .main-hero-banner { width: 100%; max-width: 1200px; margin: 15px auto; padding: 0 10px; }
        .main-hero-banner img { width: 100%; height: auto; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); display: block; }

        /* Section Titles */
        .section-header { text-align: center; margin: 30px 15px 15px; }
        .section-header h2 { font-size: 22px; color: #1b4332; font-weight: 700; display: inline-block; border-bottom: 3px solid #d4145a; padding-bottom: 5px; }

        /* Horizontal Slider */
        .slider-wrapper { overflow-x: auto; display: flex; gap: 15px; padding: 15px 20px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .slider-wrapper::-webkit-scrollbar { height: 6px; }
        .slider-wrapper::-webkit-scrollbar-thumb { background: #d4145a; border-radius: 10px; }
        
        .slide-card { min-width: 230px; width: 230px; background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); text-align: center; flex-shrink: 0; cursor: pointer; transition: transform 0.2s; border: 1px solid #f0e6e8; }
        .slide-card:hover { transform: translateY(-5px); }
        .slide-card img { width: 100%; height: 210px; object-fit: contain; border-radius: 10px; margin-bottom: 8px; }
        .slide-card h4 { font-size: 15px; color: #1b4332; margin-bottom: 6px; }
        .slide-card .view-btn { font-size: 12px; color: #d4145a; font-weight: bold; background: #fce8ee; padding: 4px 10px; border-radius: 12px; display: inline-block; }

        /* Product Grid Section */
        .container { max-width: 1100px; margin: auto; padding: 0 15px 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        
        .product-card { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); border: 1px solid #f0e6e8; text-align: center; transition: transform 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card:hover { transform: translateY(-3px); }
        .product-card img { width: 100%; height: 220px; object-fit: contain; border-radius: 10px; margin-bottom: 12px; cursor: pointer; }
        .product-card h3 { font-size: 17px; color: #1b4332; margin-bottom: 8px; font-weight: 700; }
        .product-card .card-price { font-size: 16px; font-weight: bold; color: #d4145a; margin-bottom: 12px; }
